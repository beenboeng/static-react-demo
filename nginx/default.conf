server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # NOTE: nginx `add_header` does not merge across levels — a block with any
    # add_header of its own drops every inherited one. So the security headers
    # are repeated in each location rather than set once on the server.

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        access_log off;
        try_files  $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The entry point must never be cached, or clients pin themselves to a
    # stale bundle and never pick up a deploy. Every SPA route lands here via
    # the try_files fallback below, so these headers cover all HTML responses.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback: TanStack Router owns the URL, so an unmatched path must
    # return index.html instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
